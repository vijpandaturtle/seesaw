[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seesaw"
version = "0.1.0"
description = "A multi-agent framework for automated mechanistic interpretability research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mechanistic-interpretability", "agents", "transformer-lens", "langgraph", "mcp"]

# Core: Scout + Quill + orchestrator + eval loaders (no torch — see extras).
dependencies = [
    "python-dotenv",
    "langchain-core",
    "langchain-anthropic",
    "langgraph",
    "arxiv",
    "firecrawl-py",
    "fastmcp",
    "mcp",
    "langchain-mcp-adapters",
    "pyyaml",
    "pydantic",
]

[project.optional-dependencies]
# Lens's TransformerLens experiment tools (the GPU-adjacent stack)
experiments = [
    "torch",
    "numpy",
    "matplotlib",
    "transformer-lens",
    "sae-lens",
]
# LangSmith experiment tracking for the eval suite
eval = [
    "langsmith",
    "pytest",
]
# Running Lens experiments on Modal instead of in-process
modal = [
    "modal",
]
all = ["seesaw[experiments,eval,modal]"]

[project.scripts]
seesaw = "seesaw.cli:main"

[project.urls]
Repository = "https://github.com/vijpandaturtle/seesaw"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["seesaw*", "scout*", "lens*", "quill*", "orchestrator*", "shared*", "eval*"]
exclude = ["*outputs*", "*__pycache__*"]
