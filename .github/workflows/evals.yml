# Tier 2 and 3: evals that call live agents, and therefore cost money.
#
# Deliberately not on push. Every task here spends Anthropic credit, and the
# pipeline tasks run all three agents for the better part of an hour — a merge
# should not silently do that. Run it by hand before a release, or let the
# weekly schedule catch drift in the agents' behaviour over time.
#
# Scores are compared against eval/baselines.json, so a task that used to pass
# and now doesn't fails the run rather than quietly regressing.
name: evals

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which tasks to run
        type: choice
        default: cheap
        options: [cheap, pipeline, all]
      update_baselines:
        description: Record the results as the new baseline instead of checking against it
        type: boolean
        default: false
  schedule:
    # Sunday 03:00 UTC — drift check, not a gate.
    - cron: "0 3 * * 0"

jobs:
  evals:
    runs-on: ubuntu-latest
    # Pipeline tasks run Scout, Lens, and Quill end to end.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e '.[eval,postgres]'
          # CPU wheels: the runner has no GPU, and gpt2-scale work doesn't need
          # one. Pulling the CUDA build would be gigabytes for nothing.
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[experiments]'

      - name: Cache model weights
        # TransformerLens downloads from HuggingFace on first use; without this
        # every run re-fetches gpt2.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-gpt2

      - name: Run tasks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Force SQLite: an eval run must not write into the deployed job store.
          SEESAW_DB_PATH: ${{ github.workspace }}/outputs/ci-jobs.db
        run: uv run python scripts/run_eval_suite.py --suite '${{ inputs.suite || ''cheap'' }}'

      - name: Check against baselines
        if: ${{ !inputs.update_baselines }}
        run: uv run python scripts/check_eval_baselines.py

      - name: Update baselines
        if: ${{ inputs.update_baselines }}
        run: |
          uv run python scripts/check_eval_baselines.py --write
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/baselines.json
          git diff --cached --quiet || git commit -m "Update eval baselines from CI run"
          git push

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: outputs/eval_runs/
          if-no-files-found: warn
